<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conteo Elliott</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --panel: #161b22;
      --line: #2a3140;
      --text: #e6edf3;
      --muted: #9aa4b2;
      --wave: #6ea8fe;
      --sub: #8b93a7;
      --projection: #3dd68c;
      --invalid: #ff5c7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, sans-serif;
    }
    header {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 16px; font-weight: 600; margin: 0; }
    label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
    select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
    }
    main { flex: 1; display: flex; min-height: 0; }
    #chart { flex: 1; min-width: 0; }
    aside {
      width: 320px;
      border-left: 1px solid var(--line);
      background: var(--panel);
      padding: 16px;
      overflow: auto;
    }
    aside h2 { margin: 0 0 4px; font-size: 18px; }
    .meta { color: var(--muted); margin-bottom: 16px; }
    .score { font-variant-numeric: tabular-nums; }
    h3 { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 6px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    .invalid { color: var(--invalid); }
    .projection.secondary { opacity: 0.4; }
    .outlook { color: #f5c542; }
    .zone { color: #c4b5fd; }
    .empty { color: var(--muted); }
    @media (max-width: 800px) {
      main { flex-direction: column; }
      aside { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Conteo Elliott</h1>
    <label>Conteo <select id="count"></select></label>
    <label><input id="subs" type="checkbox"> Subondas</label>
    <label><input id="outlook" type="checkbox"> Pronóstico</label>
  </header>
  <main>
    <div id="chart"></div>
    <aside id="side">
      <p class="empty">Cargando…</p>
    </aside>
  </main>
  <script>
    const countSelect = document.querySelector("#count");
    const subsToggle = document.querySelector("#subs");
    const outlookToggle = document.querySelector("#outlook");
    const side = document.querySelector("#side");
    const container = document.querySelector("#chart");

    const chart = LightweightCharts.createChart(container, {
      layout: { background: { color: "#0e1116" }, textColor: "#d1d4dc" },
      grid: { vertLines: { color: "#1c2330" }, horzLines: { color: "#1c2330" } },
      rightPriceScale: { borderColor: "#2a3140" },
      timeScale: { borderColor: "#2a3140", timeVisible: true },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    });
    const candles = chart.addCandlestickSeries({
      upColor: "#3dd68c",
      downColor: "#ff5c7a",
      borderVisible: false,
      wickUpColor: "#3dd68c",
      wickDownColor: "#ff5c7a",
    });
    const waveLine = chart.addLineSeries({
      color: "#6ea8fe",
      lineWidth: 2,
      priceLineVisible: false,
      lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    const subLines = [];
    let priceLines = [];
    let payload = { candles: [], counts: [] };

    const FIB_COLORS = {
      0.236: "#7ec8ff",
      0.382: "#5b8cff",
      0.5: "#c4b5fd",
      0.618: "#f5c542",
      0.786: "#f0a050",
      1: "#3dd68c",
      1.236: "#2ec4b6",
      1.382: "#20c997",
      1.618: "#ff9f43",
      2: "#ff7b72",
      2.618: "#e85d9a",
    };

    function fibColor(ratio) {
      const key = Number(Number(ratio).toFixed(3));
      return FIB_COLORS[key] || "#d1d4dc";
    }

    function clearPriceLines() {
      for (const line of priceLines) candles.removePriceLine(line);
      priceLines = [];
    }

    function clearSubLines() {
      while (subLines.length) chart.removeSeries(subLines.pop());
    }

    function outlookFor(count) {
      const counts = (payload.forecast && payload.forecast.counts) || [];
      return counts.find((item) => item.title === count.title) || null;
    }

    function centralTarget(outlook) {
      if (!outlook) return null;
      return outlook.targets.find((target) => target.central && !target.reached) || null;
    }

    function draw(count, showSubs, showOutlook) {
      clearPriceLines();
      clearSubLines();
      if (!count) {
        waveLine.setData([]);
        candles.setMarkers([]);
        renderSide(null, false);
        return;
      }
      waveLine.setData(count.polyline.map((point) => ({ time: point.time, value: point.price })));
      const markers = count.polyline.map((point) => ({
        time: point.time,
        position: point.label === "0" ? "belowBar" : "aboveBar",
        color: "#6ea8fe",
        shape: "circle",
        text: point.label,
      }));
      if (showSubs) {
        for (const path of count.subwaves) {
          const series = chart.addLineSeries({
            color: "#8b93a7",
            lineWidth: 1,
            priceLineVisible: false,
            lastValueVisible: false,
            crosshairMarkerVisible: false,
          });
          series.setData(path.map((point) => ({ time: point.time, value: point.price })));
          subLines.push(series);
          for (const point of path) {
            if (!point.label) continue;
            markers.push({
              time: point.time,
              position: "belowBar",
              color: "#8b93a7",
              shape: "circle",
              text: point.label,
            });
          }
        }
      }
      markers.sort((a, b) => a.time - b.time);
      const unique = [];
      for (const marker of markers) {
        if (unique.length && unique[unique.length - 1].time === marker.time) continue;
        unique.push(marker);
      }
      candles.setMarkers(unique);
      priceLines.push(candles.createPriceLine({
        price: count.invalidation,
        color: "#ff5c7a",
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: count.invalidated ? "invalidado" : "invalidación",
      }));
      if (!count.invalidated) {
        for (const level of count.projections) {
          if (!level.preferred) continue;
          priceLines.push(candles.createPriceLine({
            price: level.price,
            color: fibColor(level.ratio),
            lineWidth: 2,
            lineStyle: LightweightCharts.LineStyle.Solid,
            axisLabelVisible: true,
            title: level.label,
          }));
        }
      }
      if (showOutlook) drawOutlook(count);
      renderSide(count, showOutlook);
    }

    function drawOutlook(count) {
      const outlook = outlookFor(count);
      if (!outlook) return;
      if (Math.abs(outlook.invalidation - count.invalidation) > 1e-6) {
        priceLines.push(candles.createPriceLine({
          price: outlook.invalidation,
          color: "#ff5c7a",
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: true,
          title: "invalidación del pronóstico",
        }));
      }
      const central = centralTarget(outlook);
      if (central) {
        priceLines.push(candles.createPriceLine({
          price: central.price,
          color: "#f5c542",
          lineWidth: 2,
          lineStyle: LightweightCharts.LineStyle.Solid,
          axisLabelVisible: true,
          title: `pronóstico · ${outlook.step_label}`,
        }));
      }
      for (const zone of payload.forecast.zones || []) {
        priceLines.push(candles.createPriceLine({
          price: zone.low,
          color: "#c4b5fd",
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: true,
          title: "zona",
        }));
        if (Math.abs(zone.high - zone.low) > 1e-6) {
          priceLines.push(candles.createPriceLine({
            price: zone.high,
            color: "#c4b5fd",
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: "zona",
          }));
        }
      }
    }

    function renderSide(count, showOutlook) {
      side.replaceChildren();
      if (!count) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Ningún conteo pasó las reglas.";
        side.appendChild(empty);
        return;
      }
      const title = document.createElement("h2");
      title.textContent = count.pattern_label;
      const meta = document.createElement("p");
      meta.className = "meta";
      const share = count.invalidated ? "invalidado" : `${count.weight}%`;
      meta.textContent = `${count.title} · ${count.direction_label} · ${count.status_label} · ${share} · `;
      const score = document.createElement("span");
      score.className = "score";
      score.textContent = String(count.score);
      meta.appendChild(score);

      const invalidTitle = document.createElement("h3");
      invalidTitle.textContent = "Invalidación";
      const invalid = document.createElement("ul");
      const invalidItem = document.createElement("li");
      invalidItem.className = "invalid";
      invalidItem.textContent = count.invalidation.toFixed(2);
      invalid.appendChild(invalidItem);

      const projTitle = document.createElement("h3");
      projTitle.textContent = "Proyecciones";
      const proj = document.createElement("ul");
      if (count.invalidated) {
        const item = document.createElement("li");
        item.className = "empty";
        item.textContent = "El precio ya cruzó la invalidación.";
        proj.appendChild(item);
      } else if (!count.projections.length) {
        const item = document.createElement("li");
        item.className = "empty";
        item.textContent = "Sin objetivos con las ondas confirmadas.";
        proj.appendChild(item);
      }
      if (!count.invalidated) {
        for (const level of count.projections) {
          const item = document.createElement("li");
          item.className = level.preferred ? "projection" : "projection secondary";
          item.dataset.preferred = level.preferred ? "1" : "0";
          item.style.color = fibColor(level.ratio);
          item.textContent = level.label;
          proj.appendChild(item);
        }
      }

      const notesTitle = document.createElement("h3");
      notesTitle.textContent = "Guías";
      const notes = document.createElement("ul");
      if (!count.notes.length) {
        const item = document.createElement("li");
        item.className = "empty";
        item.textContent = "Sin guías destacadas.";
        notes.appendChild(item);
      }
      for (const note of count.notes) {
        const item = document.createElement("li");
        item.textContent = note;
        notes.appendChild(item);
      }

      const blocks = [title, meta, invalidTitle, invalid, projTitle, proj];
      if (showOutlook) blocks.push(...outlookBlocks(count));
      blocks.push(notesTitle, notes);
      side.append(...blocks);
    }

    function outlookBlocks(count) {
      const heading = document.createElement("h3");
      heading.textContent = "Pronóstico";
      const list = document.createElement("ul");
      const outlook = outlookFor(count);
      if (!outlook) {
        const item = document.createElement("li");
        item.className = "empty";
        item.textContent = "Este conteo no tiene objetivo por delante.";
        list.appendChild(item);
        return [heading, list];
      }
      const step = document.createElement("li");
      step.textContent = `Próximo: ${outlook.step_label}`;
      list.appendChild(step);
      const central = centralTarget(outlook);
      const target = document.createElement("li");
      target.className = "outlook";
      if (!central) {
        target.textContent = outlook.targets.length
          ? "El objetivo central ya fue alcanzado."
          : "Sin objetivo con las ondas confirmadas.";
      } else {
        const risk = central.reward_risk == null ? "" : ` · recompensa/riesgo ${central.reward_risk}`;
        target.textContent = `${central.price.toFixed(2)} (${signed(central.distance_pct)}%)${risk}`;
      }
      list.appendChild(target);
      if (outlook.band && outlook.band[0] !== outlook.band[1]) {
        const band = document.createElement("li");
        band.className = "outlook";
        band.textContent = `Franja ${outlook.band[0].toFixed(2)}–${outlook.band[1].toFixed(2)}`;
        list.appendChild(band);
      }
      const stop = document.createElement("li");
      stop.className = "invalid";
      stop.textContent = `Invalidación ${outlook.invalidation.toFixed(2)} (${signed(outlook.invalidation_pct)}%)`;
      list.appendChild(stop);
      const zones = (payload.forecast && payload.forecast.zones) || [];
      if (!zones.length) {
        const item = document.createElement("li");
        item.className = "empty";
        item.textContent = "Ningún par de conteos apunta a la misma zona.";
        list.appendChild(item);
      }
      for (const zone of zones) {
        const item = document.createElement("li");
        item.className = "zone";
        const span = zone.low === zone.high
          ? zone.low.toFixed(2)
          : `${zone.low.toFixed(2)}–${zone.high.toFixed(2)}`;
        item.textContent = `Zona ${span} · ${zone.titles.join(", ")} · peso ${zone.weight}%`;
        list.appendChild(item);
      }
      return [heading, list];
    }

    function signed(value) {
      return `${value >= 0 ? "+" : ""}${value.toFixed(2)}`;
    }

    function selectedCount() {
      return payload.counts[Number(countSelect.value)] || null;
    }

    function redraw() {
      draw(selectedCount(), subsToggle.checked, outlookToggle.checked);
    }

    countSelect.addEventListener("change", redraw);
    subsToggle.addEventListener("change", redraw);
    outlookToggle.addEventListener("change", redraw);
    new ResizeObserver(() => {
      chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
    }).observe(container);

    fetch("/api/chart")
      .then((response) => response.json())
      .then((body) => {
        payload = body;
        candles.setData(body.candles);
        countSelect.replaceChildren();
        body.counts.forEach((count, index) => {
          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = count.invalidated
            ? `${count.title} · ${count.pattern_label} · invalidado`
            : `${count.title} · ${count.pattern_label} · ${count.weight}%`;
          countSelect.appendChild(option);
        });
        if (!body.counts.length) {
          const option = document.createElement("option");
          option.textContent = "Sin conteos";
          countSelect.appendChild(option);
        }
        draw(selectedCount(), false, false);
        chart.timeScale().fitContent();
        document.body.dataset.ready = "1";
      })
      .catch(() => {
        side.textContent = "No se pudo leer el conteo.";
      });
  </script>
</body>
</html>
